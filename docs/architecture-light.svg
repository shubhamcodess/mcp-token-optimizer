<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 215" width="1200" height="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#57606a" stroke-width="1.4"/>
    </marker>
    <marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#0e7490" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="214" fill="#eef1f5" stroke="#d0d7de"/>

  <!-- agent -->
  <rect x="40.5" y="78.5" width="130" height="54" fill="#fbfcfd" stroke="#8c959f"/>
  <text x="105" y="110" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#1f2328">AGENT</text>
  <text x="105" y="152" text-anchor="middle" font-size="10" fill="#57606a">Copilot · Claude · Cursor</text>

  <!-- mcp server -->
  <rect x="1030.5" y="78.5" width="130" height="54" fill="#fbfcfd" stroke="#8c959f"/>
  <text x="1095" y="110" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#1f2328">MCP SERVER</text>
  <text x="1095" y="152" text-anchor="middle" font-size="10" fill="#57606a">stdio · http</text>

  <!-- optimizer -->
  <rect x="330.5" y="40.5" width="540" height="130" fill="#f6f8fa" stroke="#0e7490" stroke-opacity="0.7"/>
  <!-- header: logo + name, one small line -->
  <path d="M523 51 l-8 12 h6 l-3 10 l10 -13 h-6 z" fill="#0e7490"/>
  <text x="537" y="68" font-size="13" font-weight="700" letter-spacing="1" fill="#1f2328">mcp-token-optimizer</text>
  <path d="M350 82.5 H850" stroke="#d0d7de" fill="none"/>

  <!-- stages -->
  <g>
    <rect x="350.5" y="98.5" width="110" height="46" fill="#fbfcfd" stroke="#8c959f"/><rect x="350" y="98" width="2" height="47" fill="#0e7490"/>
    <text x="408" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1f2328">PRUNE</text>
    <text x="408" y="133" text-anchor="middle" font-size="9" fill="#57606a">drop noise</text>

    <rect x="480.5" y="98.5" width="110" height="46" fill="#fbfcfd" stroke="#8c959f"/><rect x="480" y="98" width="2" height="47" fill="#0e7490"/>
    <text x="538" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1f2328">TOON</text>
    <text x="538" y="133" text-anchor="middle" font-size="9" fill="#57606a">compact encode</text>

    <rect x="610.5" y="98.5" width="110" height="46" fill="#fbfcfd" stroke="#8c959f"/><rect x="610" y="98" width="2" height="47" fill="#0e7490"/>
    <text x="668" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1f2328">SUMMARIZE</text>
    <text x="668" y="133" text-anchor="middle" font-size="9" fill="#57606a">local ollama</text>

    <rect x="740.5" y="98.5" width="110" height="46" fill="#fbfcfd" stroke="#8c959f"/><rect x="740" y="98" width="2" height="47" fill="#0e7490"/>
    <text x="798" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1f2328">GUARD</text>
    <text x="798" y="133" text-anchor="middle" font-size="9" fill="#57606a">never bigger</text>
  </g>

  <!-- arrows: request on top, result on the bottom, on both sides -->
  <g fill="none" stroke-width="1.3">
    <path d="M172 92 H328" stroke="#57606a" marker-end="url(#g)"/>
    <path d="M328 120 H172" stroke="#0e7490" stroke-width="1.8" marker-end="url(#c)"/>
    <path d="M872 92 H1028" stroke="#57606a" marker-end="url(#g)"/>
    <path d="M1028 120 H872" stroke="#57606a" marker-end="url(#g)"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="250" y="84" fill="#57606a">request</text>
    <text x="250" y="136" fill="#0e7490" font-weight="700">compact result</text>
    <text x="950" y="84" fill="#57606a">request</text>
    <text x="950" y="136" fill="#57606a">full result</text>
  </g>

  <text x="600" y="198" text-anchor="middle" font-size="10" letter-spacing="1" fill="#57606a">runs on your machine</text>
</svg>
