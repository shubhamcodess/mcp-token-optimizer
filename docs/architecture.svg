<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 215" width="1200" height="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
    <marker id="c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="214" fill="#0b0f14" stroke="#1f2937"/>

  <!-- agent -->
  <rect x="40.5" y="78.5" width="130" height="54" fill="#0f172a" stroke="#334155"/>
  <text x="105" y="110" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#e2e8f0">AGENT</text>
  <text x="105" y="152" text-anchor="middle" font-size="10" fill="#64748b">Copilot · Claude · Cursor</text>

  <!-- mcp server -->
  <rect x="1030.5" y="78.5" width="130" height="54" fill="#0f172a" stroke="#334155"/>
  <text x="1095" y="110" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#e2e8f0">MCP SERVER</text>
  <text x="1095" y="152" text-anchor="middle" font-size="10" fill="#64748b">stdio · http</text>

  <!-- optimizer -->
  <rect x="330.5" y="40.5" width="540" height="130" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.7"/>
  <!-- header: logo + name, one small line -->
  <path d="M523 51 l-8 12 h6 l-3 10 l10 -13 h-6 z" fill="#22d3ee"/>
  <text x="537" y="68" font-size="13" font-weight="700" letter-spacing="1" fill="#e2e8f0">mcp-token-optimizer</text>
  <path d="M350 82.5 H850" stroke="#1f2937" fill="none"/>

  <!-- stages -->
  <g>
    <rect x="350.5" y="98.5" width="110" height="46" fill="#0f172a" stroke="#334155"/><rect x="350" y="98" width="2" height="47" fill="#22d3ee"/>
    <text x="408" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">PRUNE</text>
    <text x="408" y="133" text-anchor="middle" font-size="9" fill="#64748b">drop noise</text>

    <rect x="480.5" y="98.5" width="110" height="46" fill="#0f172a" stroke="#334155"/><rect x="480" y="98" width="2" height="47" fill="#22d3ee"/>
    <text x="538" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">TOON</text>
    <text x="538" y="133" text-anchor="middle" font-size="9" fill="#64748b">compact encode</text>

    <rect x="610.5" y="98.5" width="110" height="46" fill="#0f172a" stroke="#334155"/><rect x="610" y="98" width="2" height="47" fill="#22d3ee"/>
    <text x="668" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">SUMMARIZE</text>
    <text x="668" y="133" text-anchor="middle" font-size="9" fill="#64748b">local ollama</text>

    <rect x="740.5" y="98.5" width="110" height="46" fill="#0f172a" stroke="#334155"/><rect x="740" y="98" width="2" height="47" fill="#22d3ee"/>
    <text x="798" y="117" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#e2e8f0">GUARD</text>
    <text x="798" y="133" text-anchor="middle" font-size="9" fill="#64748b">never bigger</text>
  </g>

  <!-- arrows: request on top, result on the bottom, on both sides -->
  <g fill="none" stroke-width="1.3">
    <path d="M172 92 H328" stroke="#64748b" marker-end="url(#g)"/>
    <path d="M328 120 H172" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#c)"/>
    <path d="M872 92 H1028" stroke="#64748b" marker-end="url(#g)"/>
    <path d="M1028 120 H872" stroke="#64748b" marker-end="url(#g)"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="250" y="84" fill="#64748b">request</text>
    <text x="250" y="136" fill="#22d3ee" font-weight="700">compact result</text>
    <text x="950" y="84" fill="#64748b">request</text>
    <text x="950" y="136" fill="#64748b">full result</text>
  </g>

  <text x="600" y="198" text-anchor="middle" font-size="10" letter-spacing="1" fill="#64748b">runs on your machine  ·  37,355 → 13,244 tok  <tspan fill="#22d3ee" font-weight="700">−64.5%</tspan></text>
</svg>
