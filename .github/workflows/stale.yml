name: Stale issues and PRs

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days unless there is new activity.
            If it is still relevant, please comment with what has changed or a reproduction on the latest version.
          stale-pr-message: >
            This pull request has had no activity for 60 days. It will be closed in 14 days unless there is new activity.
            Feel free to reopen it later, or ask for a review if you are blocked.
          exempt-issue-labels: "security,pinned,help wanted,good first issue"
          exempt-pr-labels: "security,pinned"
