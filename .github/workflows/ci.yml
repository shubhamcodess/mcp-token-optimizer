name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - name: Dashboard bundle budget (JS, CSS, fonts, total; no external URLs)
        run: npm run ui:budget
      - name: Regression suite (savings, lossless and verdict per example against tests/eval-baseline.json)
        run: npm run eval

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relative links and anchors in the Markdown files resolve
        run: node scripts/check-links.mjs

  package:
    name: Installable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run examples
      - name: Package contents (required files, nothing forbidden, size budget, scoped name)
        run: npm run pack:check
      - name: Build the release tarball (same as the Release workflow)
        run: npm pack
      - name: Install the tarball into an empty prefix and run it
        run: |
          set -euo pipefail
          P="$(mktemp -d)"
          npm install -g --prefix "$P" ./shubhamcodess-mcp-token-optimizer-*.tgz
          "$P/bin/mto" --version
          MTO_HOME="$P/home" "$P/bin/mto" try "$P/lib/node_modules/@shubhamcodess/mcp-token-optimizer/examples/github-issues.json" 2>&1 >/dev/null | tee /dev/stderr | grep -q "saved"
      - name: The tarball ships the dashboard and an installed copy serves it
        run: |
          set -euo pipefail
          LIST="$(tar -tzf shubhamcodess-mcp-token-optimizer-*.tgz)"
          grep -q 'package/dist/ui/index.html' <<< "$LIST"
          grep -q 'package/dist/ui/assets/' <<< "$LIST"
          P="$(mktemp -d)"
          npm install -g --prefix "$P" ./shubhamcodess-mcp-token-optimizer-*.tgz
          export MTO_HOME="$P/home" MTO_NO_DAEMON=1
          "$P/bin/mto" serve --port 18787 > "$P/serve.log" 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18787/health >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18787/ | grep -q 'mto dashboard'
          curl -s -D - -o /dev/null http://127.0.0.1:18787/ | grep -qi "content-security-policy: default-src 'none'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/status)" = "401"
          "$P/bin/mto" status | grep -q 'daemon: UP'
          kill $PID

  # Single required status check for branch protection: it passes only if every job above passed.
  gate:
    name: CI gate
    if: always()
    needs: [test, docs, package]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo "test=${{ needs.test.result }} docs=${{ needs.docs.result }} package=${{ needs.package.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.docs.result }}" = "success" ] && [ "${{ needs.package.result }}" = "success" ]
