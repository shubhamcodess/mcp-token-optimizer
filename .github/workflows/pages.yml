name: Deploy site to GitHub Pages

# Builds the landing page and docs in site/ (Vite + React) and publishes them with GitHub Pages.
# The docs page, the install prompt, llms-full.txt and the release/test facts read repo files at build
# time, so changes to them redeploy too. Build also prerenders the pages to static HTML.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'docs/*.md'
      - 'tests/*.test.ts'
      - 'scripts/smoke.mjs'
      - 'TROUBLESHOOTING.md'
      - 'SECURITY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build (base path = the Pages URL path, e.g. /mcp-token-optimizer/)
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # absolute URL for canonical, OG tags, sitemap and llms.txt; follows a custom domain automatically
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
