      }

      nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
      a { display: inline-flex; align-items: center; height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); color: var(--text); text-decoration: none; }
